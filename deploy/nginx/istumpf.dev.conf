# istumpf.dev — static single-page portfolio.
#
# Content lives in /var/istumpf-dev. Source of truth is the portfolio-page
# repository; deploy with:
#   rsync -az --delete index.html assets <host>:/var/istumpf-dev/
#
# NOTE: HTTP-only on purpose. `certbot --nginx` adds the 443 server block, the
# certificate paths and the HTTP->HTTPS redirect itself. Do not hand-write those
# before the certificate exists, or nginx fails to start on a missing
# fullchain.pem.
#
# No `default_server` here — a separate catch-all vhost owns that on both
# ports, and nginx refuses to start on a duplicate default server.
#
# !! add_header inheritance !!
# nginx does not merge add_header across levels: a location containing ANY
# add_header discards every add_header inherited from the server block. An
# earlier revision of this file set Cache-Control with add_header inside
# `location = /index.html` and `location /assets/`, which silently stripped the
# CSP and the other security headers from exactly the responses that need them.
# Cache-Control is therefore set with `expires`, which is a separate directive
# and does not clobber the inherited set. If you ever add an add_header to a
# location here, re-add the security headers in that same location.

server {
    server_name istumpf.dev www.istumpf.dev;

    root /var/istumpf-dev;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/istumpf.dev.access.log;
    error_log  /var/log/nginx/istumpf.dev.error.log;

    # ---- security headers -------------------------------------------------
    # The page has no inline <script>, so script-src stays strict. It does use
    # inline style="" attributes (reveal delays, brand accent), which is why
    # style-src needs 'unsafe-inline'. Fonts come from Google; the favicon is a
    # data: URI. Nothing else leaves the origin.
    add_header X-Content-Type-Options   nosniff always;
    add_header X-Frame-Options          DENY always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # ---- caching ----------------------------------------------------------
    # Assets are not content-hashed (no build step), so a short TTL rather than
    # immutable/1y — otherwise a deploy stays invisible to anyone who already
    # loaded the page.
    location /assets/ {
        expires 1h;
        access_log off;
    }

    location = /index.html {
        expires -1;          # -> Cache-Control: no-cache
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt HTTP-01 lands here. certbot's nginx authenticator handles it
    # in place, but keep the path explicit and un-redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/istumpf-dev;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # No dotfile leakage. /.well-known is matched earlier by ^~ so ACME is safe.
    location ~ /\. {
        deny all;
        access_log off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/istumpf.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/istumpf.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.istumpf.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = istumpf.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name istumpf.dev www.istumpf.dev;
    return 404; # managed by Certbot




}